[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-arrhythmia-classifier"
version = "0.1.0"
description = "Clasificador de latidos ECG (AAMI N/S/V/F) sobre MIT-BIH con evaluación inter-paciente. Proyecto educativo, no es un dispositivo médico."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "wfdb>=4.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "neurokit2>=0.2.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# La API no necesita PyTorch: sirve el baseline (XGBoost). Dejarlo fuera de las dependencias base
# baja la imagen de Docker de ~700 MB a ~250 MB.
api = ["fastapi>=0.110", "uvicorn>=0.29"]
app = ["streamlit>=1.33"]
dl = ["torch>=2.2"]  # solo para la CNN (ecg.models.cnn, ecg.train, ecg.evaluate_external)
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27", "jupyter", "nbconvert", "ipykernel", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
